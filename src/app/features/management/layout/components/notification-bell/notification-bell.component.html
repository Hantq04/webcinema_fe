<div class="notification-container">
  <!-- Bell Toggle Button -->
  <button class="icon-btn bell-btn" [class.active]="isOpen()" (click)="toggleDropdown($event)" [attr.aria-expanded]="isOpen()" title="Notifications">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
      <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
    </svg>
    <span class="notification-badge" *ngIf="unreadCount() > 0">
      {{ unreadCount() > 99 ? '99+' : unreadCount() }}
    </span>
  </button>

  <!-- Notification Dropdown Panel -->
  <div class="notification-dropdown animate-scale-up" *ngIf="isOpen()">
    <!-- Dropdown Header -->
    <div class="dropdown-header">
      <h3 class="dropdown-title">{{ textNotifications }}</h3>
      <button 
        *ngIf="unreadCount() > 0" 
        class="mark-all-btn" 
        (click)="markAllRead($event)"
      >
        {{ textMarkAllRead }}
      </button>
    </div>

    <!-- Dropdown Body -->
    <div class="dropdown-body">
      <!-- Loading State -->
      <div class="dropdown-loading" *ngIf="isLoading()">
        <div class="mini-spinner"></div>
        <span>{{ textLoading }}</span>
      </div>

      <!-- Empty State -->
      <div class="dropdown-empty" *ngIf="!isLoading() && notifications().length === 0">
        <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--m-text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
        <p>{{ textNoNotifications }}</p>
      </div>

      <!-- Notifications List -->
      <div class="notifications-list" *ngIf="!isLoading() && notifications().length > 0">
        <div 
          *ngFor="let item of notifications()" 
          class="notification-item" 
          [class.unread]="!item.isRead"
          (click)="onNotificationClick(item, $event)"
        >
          <!-- Notification Icon based on type -->
          <div class="item-icon-wrapper" [class]="item.type.toLowerCase() || 'default'">
            <!-- Dynamic SVG icons depending on type -->
            <svg *ngIf="getNotificationIcon(item.type) === 'settings'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <svg *ngIf="getNotificationIcon(item.type) === 'ticket'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>
            <svg *ngIf="getNotificationIcon(item.type) === 'trending-up'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
            <svg *ngIf="getNotificationIcon(item.type) === 'user'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <svg *ngIf="getNotificationIcon(item.type) === 'bell'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          </div>

          <!-- Notification Details -->
          <div class="item-content-wrapper">
            <div class="item-header">
              <span class="item-title">{{ item.title }}</span>
              <span class="unread-dot" *ngIf="!item.isRead"></span>
            </div>
            <p class="item-body">{{ item.content }}</p>
            <div class="item-meta">
              <span class="item-time">{{ item.createTime | date:'dd/MM/yyyy HH:mm' }}</span>
              <button 
                *ngIf="!item.isRead" 
                class="mark-read-btn" 
                (click)="markRead(item, $event)"
                title="Mark as read"
              >
                <!-- Check Icon SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Dropdown Footer -->
    <div class="dropdown-footer">
      <button class="view-all-btn" (click)="viewAll($event)">
        {{ textViewAll }}
      </button>
    </div>
  </div>
</div>
